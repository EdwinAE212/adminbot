<div
  class="fixed left-0 top-0 h-full bg-blue-800 text-white flex flex-col items-center py-6 shadow-lg z-40 transition-[width] duration-300"
  (mouseenter)="openSidebar()"
  (mouseleave)="closeSidebar()"
  [class.w-60]="isOpen"
  [class.w-16]="!isOpen">

  <div class="w-full flex flex-col">
    <a [routerLink]="['/inicio']"
       class="w-full flex items-center gap-3 py-3 px-4 hover:bg-blue-700 transition">
      <i class="fa-solid fa-house text-xl"></i>
      <span class="ml-2 transition-all duration-300 overflow-hidden"
            [class.opacity-0]="!isOpen"
            [class.opacity-100]="isOpen"
            [class.whitespace-nowrap]="!isOpen">
        Inicio
      </span>
    </a>

    <a [routerLink]="['/tutores']"
       class="w-full flex items-center gap-3 py-3 px-4 hover:bg-blue-700 transition">
      <i class="fa-solid fa-chalkboard-user text-xl"></i>
      <span class="ml-2 transition-all duration-300 overflow-hidden"
            [class.opacity-0]="!isOpen"
            [class.opacity-100]="isOpen"
            [class.whitespace-nowrap]="!isOpen">
        Tutores
      </span>
    </a>

    <a [routerLink]="['/jefe-de-grupo']"
       class="w-full flex items-center gap-3 py-3 px-4 hover:bg-blue-700 transition">
      <i class="fa-solid fa-users-rectangle text-xl"></i>
      <span class="ml-2 transition-all duration-300 overflow-hidden"
            [class.opacity-0]="!isOpen"
            [class.opacity-100]="isOpen"
            [class.whitespace-nowrap]="!isOpen">
        Jefes de Grupo
      </span>
    </a>
  </div>

  <div class="mt-auto w-full flex flex-col items-center border-t border-blue-700 pt-4">
    <a [routerLink]="['/addmin']"
       class="w-full flex items-center gap-3 py-3 px-4 hover:bg-blue-700 transition">
      <i class="fa-solid fa-user-plus text-xl"></i>
      <span class="ml-2 transition-all duration-300 overflow-hidden"
            [class.opacity-0]="!isOpen"
            [class.opacity-100]="isOpen"
            [class.whitespace-nowrap]="!isOpen">
        Agregar Administrador
      </span>
    </a>

    <a [routerLink]="['/perfil']"
       class="w-full flex items-center gap-3 py-3 px-4 hover:bg-blue-700 transition">
      <i class="fa-solid fa-user-circle text-xl"></i>
      <span class="ml-2 transition-all duration-300 overflow-hidden"
            [class.opacity-0]="!isOpen"
            [class.opacity-100]="isOpen"
            [class.whitespace-nowrap]="!isOpen">
        Perfil
      </span>
    </a>

    <button (click)="onLogout()"
       class="w-full flex items-center gap-3 py-3 px-4 text-red-400 hover:bg-red-600 hover:text-white transition mt-2">
      <i class="fa-solid fa-right-from-bracket text-xl"></i>
      <span class="ml-2 transition-all duration-300 overflow-hidden"
            [class.opacity-0]="!isOpen"
            [class.opacity-100]="isOpen"
            [class.whitespace-nowrap]="!isOpen">
        Cerrar Sesión
      </span>
    </button>
  </div>
</div>
