<div
  class="fixed left-0 top-0 h-full bg-blue-800 text-white flex flex-col items-center py-6 shadow-lg z-40 transition-[width] duration-300"
  (mouseenter)="openSidebar()"
  (mouseleave)="closeSidebar()"
  [class.w-60]="isOpen"
  [class.w-16]="!isOpen">

  <!-- Parte superior -->
  <a [routerLink]="['/inicio']"
     class="w-full flex items-center gap-3 py-3 px-4 hover:bg-blue-700 transition">
    <i class="fa-solid fa-house text-xl"></i>
    <span class="ml-2 transition-all duration-300 overflow-hidden"
          [class.opacity-0]="!isOpen"
          [class.opacity-100]="isOpen"
          [class.whitespace-nowrap]="isOpen">
      Inicio
    </span>
  </a>

  <a [routerLink]="['/tutores']"
     class="w-full flex items-center gap-3 py-3 px-4 hover:bg-blue-700 transition">
    <i class="fa-solid fa-chalkboard-user text-xl"></i>
    <span class="ml-2 transition-all duration-300 overflow-hidden"
          [class.opacity-0]="!isOpen"
          [class.opacity-100]="isOpen"
          [class.whitespace-nowrap]="isOpen">
      Tutores
    </span>
  </a>

  <!-- Sección inferior -->
  <div class="mt-auto w-full flex flex-col items-center">
    <a [routerLink]="['/addmin']"
       class="w-full flex items-center gap-3 py-3 px-4 hover:bg-blue-700 transition">
      <i class="fa-solid fa-user-plus text-xl"></i>
      <span class="ml-2 transition-all duration-300 overflow-hidden"
            [class.opacity-0]="!isOpen"
            [class.opacity-100]="isOpen"
            [class.whitespace-nowrap]="isOpen">
        Agregar Administrador
      </span>
    </a>

    <a [routerLink]="['/perfil']"
       class="w-full flex items-center gap-3 py-3 px-4 hover:bg-blue-700 transition">
      <i class="fa-solid fa-user-circle text-2xl"></i>
      <span class="ml-2 transition-all duration-300 overflow-hidden"
            [class.opacity-0]="!isOpen"
            [class.opacity-100]="isOpen"
            [class.whitespace-nowrap]="isOpen">
        Perfil
      </span>
    </a>
  </div>
</div>
