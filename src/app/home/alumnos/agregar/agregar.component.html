<div class="max-w-4xl mx-auto mt-10 bg-white p-8 rounded-xl shadow-md">
  <h2 class="text-3xl font-bold mb-6 text-center">Agregar Alumno</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <!-- Alumno -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div>
        <label class="block font-semibold mb-1">Matrícula</label>
        <input formControlName="Matricula" type="text" name="Matricula" class="w-full border border-gray-300 p-2 rounded" required />
      </div>

      <div>
        <label class="block font-semibold mb-1">Nombre</label>
        <input formControlName="nombre" type="text" name="nombre" class="w-full border border-gray-300 p-2 rounded" required />
      </div>

      <div>
        <label class="block font-semibold mb-1">Apellido Paterno</label>
        <input formControlName="apellido_paterno" type="text" name="apellido_paterno" class="w-full border border-gray-300 p-2 rounded" required />
      </div>

      <div>
        <label class="block font-semibold mb-1">Apellido Materno</label>
        <input formControlName="apellido_materno" type="text" name="apellido_materno" class="w-full border border-gray-300 p-2 rounded" required />
      </div>

      <div>
        <label class="block font-semibold mb-1">Email</label>
        <input formControlName="email" type="email" name="email" class="w-full border border-gray-300 p-2 rounded" />
      </div>

      <div>
        <label class="block font-semibold mb-1">Teléfono</label>
        <input formControlName="telefono" type="tel" name="telefono" class="w-full border border-gray-300 p-2 rounded" />
      </div>
    </div>

    <!-- Tutor -->
    <h3 class="text-2xl font-bold mt-10 mb-4">Datos del Tutor</h3>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div>
        <label class="block font-semibold mb-1">Nombre</label>
        <input formControlName="nombre_tutor" type="text" name="nombre_tutor" class="w-full border border-gray-300 p-2 rounded" required />
      </div>

      <div>
        <label class="block font-semibold mb-1">Apellido Paterno</label>
        <input formControlName="apellido_paterno_tutor" type="text" name="apellido_paterno_tutor" class="w-full border border-gray-300 p-2 rounded" required />
      </div>

      <div>
        <label class="block font-semibold mb-1">Apellido Materno</label>
        <input formControlName="apellido_materno_tutor" type="text" name="apellido_materno_tutor" class="w-full border border-gray-300 p-2 rounded" required />
      </div>

      <div>
        <label class="block font-semibold mb-1">Teléfono</label>
        <input formControlName="telefono_tutor" type="tel" name="telefono_tutor" class="w-full border border-gray-300 p-2 rounded" required />
      </div>
    </div>

    <!-- Botón -->
    <div class="flex justify-center mt-10">
      <button 
        type="submit" 
        [disabled]="form.invalid" 
        class="bg-blue-600 text-white px-8 py-3 rounded hover:bg-blue-700 transition">
        Guardar Alumno y Tutor
      </button>
    </div>
  </form>
</div>
