<app-header></app-header>
<div class="max-w-4xl mx-auto mt-10 bg-white p-8 rounded-xl shadow-md">
    <h2 class="text-3xl font-bold mb-6 text-center">Agregar Alumno</h2>
  
    <form (ngSubmit)="guardarAlumno()">
      <!-- Alumno -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block font-semibold mb-1">Matrícula</label>
          <input type="text"  name="matricula" class="w-full border border-gray-300 p-2 rounded" required />
        </div>
  
        <div>
          <label class="block font-semibold mb-1">Nombre</label>
          <input type="text"  name="nombre" class="w-full border border-gray-300 p-2 rounded" required />
        </div>
  
        <div>
          <label class="block font-semibold mb-1">Apellido Paterno</label>
          <input type="text"  name="apellidoPaterno" class="w-full border border-gray-300 p-2 rounded" required />
        </div>
  
        <div>
          <label class="block font-semibold mb-1">Apellido Materno</label>
          <input type="text"  name="apellidoMaterno" class="w-full border border-gray-300 p-2 rounded" required />
        </div>
  
        <div>
          <label class="block font-semibold mb-1">Email</label>
          <input type="email"  name="email" class="w-full border border-gray-300 p-2 rounded" />
        </div>
  
        <div>
          <label class="block font-semibold mb-1">Teléfono</label>
          <input type="tel"  name="telefono" class="w-full border border-gray-300 p-2 rounded" />
        </div>
      </div>
  
      <!-- Tutor -->
      <h3 class="text-2xl font-bold mt-10 mb-4">Datos del Tutor</h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block font-semibold mb-1">Nombre</label>
          <input type="text"  name="tutorNombre" class="w-full border border-gray-300 p-2 rounded" />
        </div>
  
        <div>
          <label class="block font-semibold mb-1">Apellido Paterno</label>
          <input type="text"  name="tutorApellidoPaterno" class="w-full border border-gray-300 p-2 rounded" />
        </div>
  
        <div>
          <label class="block font-semibold mb-1">Apellido Materno</label>
          <input type="text"  name="tutorApellidoMaterno" class="w-full border border-gray-300 p-2 rounded" />
        </div>
  
        <div>
          <label class="block font-semibold mb-1">Teléfono</label>
          <input type="tel"  name="tutorTelefono" class="w-full border border-gray-300 p-2 rounded" />
        </div>
      </div>
  
      <!-- Botón -->
      <div class="flex justify-center mt-10">
        <button type="submit" class="bg-blue-600 text-white px-8 py-3 rounded hover:bg-blue-700 transition">
          Guardar Alumno
        </button>
      </div>
    </form>
  </div>
