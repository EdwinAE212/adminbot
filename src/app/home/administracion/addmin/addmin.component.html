<div class="flex items-start justify-center bg-gray-100 p-18 pt-10">
  
  <div class="bg-white p-8 rounded-xl shadow-xl w-full max-w-lg">
    
    <h2 class="text-3xl font-bold mb-6 text-center text-blue-800">Agregar Administrador</h2>
    
    <form>
      
      <div class="mb-6">
        <label class="block text-blue-800 font-semibold mb-2">Usuario</label>
        <input type="text" name="usuario" required class="w-full border border-blue-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400 shadow-sm transition duration-200 hover:border-blue-400" />
      </div>

      <div class="mb-6">
        <label class="block text-blue-800 font-semibold mb-2">Email</label>
        <input type="email" name="email" required class="w-full border border-blue-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400 shadow-sm transition duration-200 hover:border-blue-400" />
      </div>

      <div class="mb-6">
        <label class="block text-blue-800 font-semibold mb-2">Teléfono</label>
        <input type="tel" name="telefono" required class="w-full border border-blue-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400 shadow-sm transition duration-200 hover:border-blue-400" />
      </div>

      <div class="mb-6">
        <label class="block text-blue-800 font-semibold mb-2">Contraseña</label>
        <input type="password" name="contraseña" required class="w-full border border-blue-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400 shadow-sm transition duration-200 hover:border-blue-400" />
      </div>

      <div class="mb-6">
        <label class="block text-blue-800 font-semibold mb-2">Confirmar contraseña</label>
        <input type="password" name="contraseña" required class="w-full border border-blue-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400 shadow-sm transition duration-200 hover:border-blue-400" />
      </div>

      <div class="flex justify-center">
        <button type="submit" class="bg-yellow-400 text-white px-6 py-3 rounded-xl shadow-lg hover:bg-yellow-500 transition duration-300 ease-in-out focus:outline-none focus:ring-2 focus:ring-blue-400 cursor-pointer">
          Guardar Administrador
        </button>
      </div>
      
    </form>
  </div>
</div>
