<app-header></app-header>
<div class="min-h-screen flex items-center justify-center bg-gray-100 p-6">
    <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-lg">
      <h2 class="text-2xl font-bold mb-6 text-center">Agregar Administrador</h2>
  
        <div>
          <label class="block font-semibold">Usuario</label>
          <input type="text"  name="usuario" required class="w-full p-2 border rounded" />
        </div>
  
        <div>
          <label class="block font-semibold">Email</label>
          <input type="email"  name="email" required class="w-full p-2 border rounded" />
        </div>
  
        <div>
          <label class="block font-semibold">Teléfono</label>
          <input type="tel"  name="telefono" required class="w-full p-2 border rounded" />
        </div>
  
        <div>
          <label class="block font-semibold">Contraseña</label>
          <input type="password"  name="contraseña" required class="w-full p-2 border rounded" />
        </div>
  
        <button type="submit" class="mt-4 w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">
          Guardar Administrador
        </button>
    </div>
  </div>
