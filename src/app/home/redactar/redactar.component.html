<app-header></app-header>

<div class="max-w-3xl mx-auto mt-10 bg-white p-8 rounded-xl shadow-xl">
  <h2 class="text-3xl font-bold mb-6 text-center text-blue-800">Redactar Aviso</h2>

  <form>
    <!-- Grupo -->
    <div class="mb-6">
      <label class="block text-blue-800 font-semibold mb-2">Seleccionar Grupo</label>
      <select name="grupo" class="w-full border border-blue-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400 shadow-sm transition duration-200 hover:border-blue-400" required>
        <option value="todos">Todos los grupos</option>
      </select>
    </div>

    <!-- Alumno -->
    <div class="mb-6">
      <label class="block text-blue-800 font-semibold mb-2">Seleccionar Alumno</label>
      <select name="alumno" class="w-full border border-blue-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400 shadow-sm transition duration-200 hover:border-blue-400" required>
        <option value="todos">Todos los alumnos</option>
      </select>
    </div>

    <!-- Asunto -->
    <div class="mb-6">
      <label class="block text-blue-800 font-semibold mb-2">Asunto</label>
      <input type="text" name="asunto" class="w-full border border-blue-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400 shadow-sm transition duration-200 hover:border-blue-400" required />
    </div>

    <!-- Descripción -->
    <div class="mb-6">
      <label class="block text-blue-800 font-semibold mb-2">Descripción</label>
      <textarea name="descripcion" rows="6" class="w-full border border-blue-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400 shadow-sm transition duration-200 hover:border-blue-400" required></textarea>
    </div>

    <!-- Botón Enviar -->
    <div class="flex justify-center">
      <button type="submit" class="bg-yellow-400 text-white px-6 py-3 rounded-xl shadow-lg hover:bg-yellow-500 transition duration-300 ease-in-out focus:outline-none focus:ring-2 focus:ring-blue-400">Enviar Aviso</button>
    </div>
  </form>
</div>
