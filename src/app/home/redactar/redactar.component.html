<app-header></app-header>
<div class="max-w-3xl mx-auto mt-10 bg-white p-8 rounded-xl shadow-md">
    <h2 class="text-3xl font-bold mb-6 text-center">Redactar Aviso</h2>
  
    <form>
      <!-- Grupo -->
      <div class="mb-4">
        <label class="block text-gray-700 font-semibold mb-2">Seleccionar Grupo</label>
        <select name="grupo" class="w-full border border-gray-300 p-2 rounded" required>
          <option value="todos">Todos los grupos</option>
        </select>
      </div>
  
      <!-- Alumno -->
      <div class="mb-4">
        <label class="block text-gray-700 font-semibold mb-2">Seleccionar Alumno</label>
        <select name="alumno" class="w-full border border-gray-300 p-2 rounded" required>
          <option value="todos">Todos los alumnos</option>
        </select>
      </div>
  
      <!-- Asunto -->
      <div class="mb-4">
        <label class="block text-gray-700 font-semibold mb-2">Asunto</label>
        <input type="text" name="asunto" class="w-full border border-gray-300 p-2 rounded" required />
      </div>
  
      <!-- Descripción -->
      <div class="mb-4">
        <label class="block text-gray-700 font-semibold mb-2">Descripción</label>
        <textarea name="descripcion" rows="6" class="w-full border border-gray-300 p-2 rounded" required></textarea>
      </div>
  
      <!-- Imágenes 
      <div class="mb-6">
        <label class="block text-gray-700 font-semibold mb-2">Agregar Imágenes</label>
        <input type="file" (change)="onFileSelected($event)" multiple class="w-full" />
      </div>
    -->
      <div class="flex justify-center">
        <button type="submit" class="bg-blue-500 text-white px-6 py-2 rounded hover:bg-blue-600 transition">Enviar Aviso</button>
      </div>
    </form>
  </div>
