<div class="max-w-3xl mx-auto mt-10 bg-white p-8 rounded-xl shadow-xl">
  <h2 class="text-3xl font-bold mb-6 text-center text-blue-800">Redactar Reporte</h2>

  <form (ngSubmit)="onSubmit()">
    <div class="mb-6">
      <label class="block text-blue-800 font-semibold mb-2">Asunto</label>
      <input type="text" name="asunto" [(ngModel)]="reporte.asunto" 
             class="w-full border border-blue-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400 shadow-sm transition duration-200 hover:border-blue-400" required />
    </div>

    <div class="mb-6">
    <label class="block text-blue-800 font-semibold mb-2">Carrera</label>
    <select name="carrera" [(ngModel)]="reporte.carreraSeleccionada" (change)="onCarreraChange()" required
      class="w-full border border-blue-300 p-3 rounded-lg focus:ring-2 focus:ring-yellow-400 bg-white shadow-sm">
      <option value="" disabled>Selecciona una carrera</option>
      <option *ngFor="let c of carreras" [value]="c">{{ c }}</option>
    </select>
  </div>

  <div class="mb-6">
    <label class="block text-blue-800 font-semibold mb-2">Grupo al que va dirigido</label>
    <select name="grupo" [(ngModel)]="reporte.grupoId" [disabled]="!reporte.carreraSeleccionada" required
      class="w-full border border-blue-300 p-3 rounded-lg focus:ring-2 focus:ring-yellow-400 bg-white shadow-sm disabled:bg-gray-100">
      <option value="" disabled>Selecciona un grupo</option>
      <option *ngFor="let g of gruposFiltrados" [value]="g._id">{{ g.nombre }}</option>
    </select>
  </div>

    <div class="mb-6">
      <label class="block text-blue-800 font-semibold mb-2">Descripción</label>
      <textarea name="descripcion" [(ngModel)]="reporte.descripcion" rows="6" 
                class="w-full border border-blue-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400 shadow-sm transition duration-200 hover:border-blue-400" required></textarea>
    </div>

    <div class="mb-6">
      <label class="block text-blue-800 font-semibold mb-2">Agregar Imagen</label>
      <input type="file" (change)="onImageSelected($event)" accept="image/*"
             class="w-full border border-blue-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400 shadow-sm transition duration-200 hover:border-blue-400" />
    </div>

    <div *ngIf="imagePreview" class="mb-6">
      <p class="text-blue-800 font-semibold mb-2">Vista Previa:</p>
      <img [src]="imagePreview" alt="Vista previa" class="w-full max-h-64 object-contain rounded-lg border border-blue-300 shadow" />
    </div>

    <div class="flex justify-center">
      <button type="submit" class="bg-yellow-400 text-white px-6 py-3 rounded-xl shadow-lg hover:bg-yellow-500 transition duration-300 ease-in-out focus:outline-none focus:ring-2 focus:ring-blue-400">
        Enviar Aviso
      </button>
    </div>
  </form>
</div>
